name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,names]"
      - run: python -m pytest -q
      - name: Release metadata files agree with pyproject.toml
        run: python set_version.py --check

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python mcpb/build.py
      - run: npx --yes @anthropic-ai/mcpb validate build/bundle/manifest.json
      - name: The built bundle answers initialize on a cold cache
        run: python tests/bundle_handshake.py dist/*.mcpb --cold
