[project]
name = "bibliograph-mcp"
version = "2.0.0"
description = "Scholarly search for AI assistants, Japan and Korea first: one MCP server gathering NDL, WARP, CiNii, J-STAGE, JDCat, KCI and Open Access Korea, OpenAlex, Semantic Scholar, Crossref and Japanese name/authority lookup, with one typed envelope and one receipts ledger."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Christopher Gerteis", email = "christopher.gerteis@gmail.com" },
]
keywords = [
    "bibliographic-search",
    "japan-studies",
    "japanese-studies",
    "digital-humanities",
    "mcp",
    "model-context-protocol",
    "query-receipts",
    "scholarly-metadata",
    "national-diet-library",
    "cinii",
    "crossref",
    "kci",
    "korean-studies",
    "openalex",
    "semantic-scholar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "requests>=2.31",
    "pdfminer.six>=20231228",
    "korea-scholarship-mcp @ git+https://github.com/ckgerteis/korea-scholarship-mcp@v0.7.0",
]

[project.scripts]
bibliograph = "bibliograph.cli:main"
bibliograph-mcp = "bibliograph.server:main"
bibliograph-mcp-ledger = "bibliograph.ledger:_cli"
bibliograph-build-names = "bibliograph.sources.names.build_index:main"

[project.optional-dependencies]
names = []
test = ["pytest>=8", "jsonschema>=4", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/ckgerteis/bibliograph-mcp"
Repository = "https://github.com/ckgerteis/bibliograph-mcp"
Changelog = "https://github.com/ckgerteis/bibliograph-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/ckgerteis/bibliograph-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bibliograph"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CITATION.cff",
    "/CHANGELOG.md",
    "/docs",
    "/mcpb",
    "/response-schema.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
